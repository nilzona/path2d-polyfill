name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Git Config
        run: |
          git config user.name "nilzona"
          git config user.email "nilssonanders79@gmail.com"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm i
      - name: Build Packages
        run: pnpm build
      - name: Create Release Pull Request or Publish to Qlik GitHub Packages npm registry
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          push-with-git-cli: true
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          publish-script: pnpm publish-packages
          create-github-releases: true
